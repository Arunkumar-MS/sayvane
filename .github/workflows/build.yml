name: build

# Every merge to main that changes the app builds all three installers, then cuts the
# next version: tag, GitHub release, installers, checksums and a source zip. Website,
# docs and Markdown-only changes are ignored. Put [skip release] in a commit message
# to build without releasing.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**.md", ".claude/**", ".agents/**", "LICENSE"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**.md", ".claude/**", ".agents/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# Releases are serialized so two merges can never pick the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            release=true
          fi
          # Only the subject line counts, so a body that merely mentions the token is safe.
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          case "$subject" in *"[skip release]"*) release=false ;; esac

          # Bump the patch of the newest tag. Raising "version" in tauri.conf.json past
          # the newest tag (for example to 0.2.0) releases exactly that version instead.
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -z "$latest" ]; then
            version="$conf"
          elif [ "$(printf '%s\n%s\n' "$latest" "$conf" | sort -V | tail -n1)" = "$conf" ] && [ "$conf" != "$latest" ]; then
            version="$conf"
          else
            IFS=. read -r a b c <<< "$latest"
            version="$a.$b.$((c + 1))"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release=$release version=$version (latest tag: ${latest:-none}, tauri.conf: $conf)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch: arm64
            asset: Sayvane-macOS-AppleSilicon.dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch: x86_64
            asset: Sayvane-macOS-Intel.dmg
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
            asset: Sayvane-Windows-x64-Setup.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
          rustup default 1.99.1

      # Compiled Rust dependencies are the bulk of the build time. Only main saves the
      # cache; pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The speech engine only changes when its sources or build scripts do.
      - name: Cache speech worker
        id: worker-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/binaries/sayvane-speech-${{ matrix.target }}*
          key: worker-${{ matrix.target }}-${{ hashFiles('speech-worker/**', 'scripts/build-worker.*') }}
      - name: Build speech worker (macOS)
        if: runner.os == 'macOS' && steps.worker-cache.outputs.cache-hit != 'true'
        run: scripts/build-worker.sh ${{ matrix.target }}
      - name: Build speech worker (Windows)
        if: runner.os == 'Windows' && steps.worker-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-worker.ps1

      - name: Cache test model
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/models
          key: model-tiny.en-${{ hashFiles('models/manifest.json') }}

      - name: Verify worker architecture
        shell: bash
        run: |
          f=$(ls src-tauri/binaries/sayvane-speech-${{ matrix.target }}*)
          file "$f"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test "$(lipo -archs "$f")" = "${{ matrix.arch }}"
            otool -l "$f" | grep -A3 LC_BUILD_VERSION | grep -q "minos 13.0"
          else
            file "$f" | grep -q "x86-64"
          fi

      - name: Worker smoke test (real model)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          url=$(python3 -c "import json;m=[x for x in json.load(open('models/manifest.json'))['models'] if x['id']=='tiny.en'][0];print(m['url'])")
          sha=$(python3 -c "import json;m=[x for x in json.load(open('models/manifest.json'))['models'] if x['id']=='tiny.en'][0];print(m['sha256'])")
          [ -s "$RUNNER_TEMP/models/tiny.en.bin" ] || curl -sSL -o "$RUNNER_TEMP/models/tiny.en.bin" "$url"
          python3 -c "import hashlib,sys;h=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest();assert h==sys.argv[2],h" "$RUNNER_TEMP/models/tiny.en.bin" "$sha"
          python3 -I speech-worker/tests/smoke.py --worker "$(ls src-tauri/binaries/sayvane-speech-${{ matrix.target }}*)" --model "$RUNNER_TEMP/models/tiny.en.bin"
          echo "SAYVANE_TEST_MODEL=$RUNNER_TEMP/models/tiny.en.bin" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-branding/index.mjs
      - run: pnpm test
      - run: pnpm build

      - name: Core tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          args=""
          if [ "${{ needs.version.outputs.release }}" = "true" ]; then
            # Stamp the release version into the installer without editing the repo.
            echo '{"version":"${{ needs.version.outputs.version }}"}' > release-version.json
            args="--config release-version.json"
          fi
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} $args

      - name: Verify bundle architecture
        shell: bash
        run: |
          base=src-tauri/target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "macOS" ]; then
            app=$(ls -d $base/bundle/macos/*.app)
            for bin in "$app"/Contents/MacOS/*; do
              echo "$bin: $(lipo -archs "$bin")"
              test "$(lipo -archs "$bin")" = "${{ matrix.arch }}"
            done
            # No development-machine paths or Homebrew libraries may leak into the bundle.
            ! otool -L "$app"/Contents/MacOS/* | grep -E "/usr/local|/opt/homebrew|/Users/"
          else
            ls -l $base/bundle/nsis/
            python3 - "$base" <<'PY'
          import glob, struct, sys
          exes = glob.glob(sys.argv[1] + "/*.exe")
          assert exes, "no .exe found in " + sys.argv[1]
          for path in exes:
              with open(path, "rb") as f:
                  data = f.read(4096)
              offset = struct.unpack_from("<I", data, 0x3C)[0]
              assert data[offset:offset + 4] == b"PE\0\0", path + " is not a PE file"
              machine = struct.unpack_from("<H", data, offset + 4)[0]
              print(path, hex(machine))
              assert machine == 0x8664, path + " is not x86-64"
          PY
          fi

      # Fixed file names let the website link to releases/latest/download/<name>,
      # which always resolves to the newest release.
      - name: Collect installer
        shell: bash
        run: |
          base=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            src=$(ls $base/dmg/*.dmg)
          else
            src=$(ls $base/nsis/*-setup.exe)
          fi
          test "$(echo "$src" | wc -l)" -eq 1
          cp "$src" "dist/${{ matrix.asset }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Source archive and checksums
        run: |
          git archive --format=zip --prefix="sayvane-$VERSION/" -o dist/Sayvane-source.zip HEAD
          cd dist
          sha256sum Sayvane-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Download

          | Computer | File |
          | --- | --- |
          | Mac, Apple Silicon (M1 and later) | `Sayvane-macOS-AppleSilicon.dmg` |
          | Mac, Intel | `Sayvane-macOS-Intel.dmg` |
          | Windows 10 22H2 / 11, 64 bit | `Sayvane-Windows-x64-Setup.exe` |

          Verify a download against `SHA256SUMS.txt`. The source code is `Sayvane-source.zip`.

          These builds are not code signed yet. On a Mac, right click the app and choose Open the
          first time. On Windows, choose More info, then Run anyway, in the SmartScreen prompt.

          ## What changed
          EOF

      - name: Create tag and release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Sayvane $VERSION" \
              --notes-file notes.md --generate-notes \
              --latest
          fi
